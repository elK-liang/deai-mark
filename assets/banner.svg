<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="Georgia, 'Times New Roman', serif">
  <!-- paper -->
  <rect width="1200" height="320" fill="#fbfaf7"/>
  <rect x="0" y="0" width="1200" height="6" fill="#a42a25"/>
  <!-- left: wordmark + headline -->
  <text x="56" y="58" font-family="Consolas, Menlo, monospace" font-size="15" letter-spacing="2" fill="#8a857c">LESS-AI-TONE-ACADEMIC</text>
  <text x="56" y="118" font-size="40" fill="#1c1917">AI tells, measured</text>
  <text x="56" y="164" font-size="40" fill="#1c1917">and removed.</text>
  <text x="56" y="208" font-size="17" fill="#57534e">A rewrite ruleset for English biomedical</text>
  <text x="56" y="232" font-size="17" fill="#57534e">manuscripts, built from a paired corpus.</text>
  <text x="56" y="278" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#a42a25">879 human papers</text>
  <text x="248" y="278" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#8a857c">3 model families</text>
  <text x="402" y="278" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#8a857c">57 operators</text>
  <text x="522" y="278" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#8a857c">3 validation rounds</text>
  <!-- right: the marked-up manuscript line (real corpus example) -->
  <g>
    <rect x="664" y="64" width="480" height="192" fill="#ffffff" stroke="#e5e1d8"/>
    <text x="686" y="92" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#a42a25">BEFORE, FROM THE CORPUS</text>
    <text x="686" y="124" font-size="15.5" fill="#1c1917" font-style="italic">
      <tspan x="686" dy="0">Three miRNAs</tspan><tspan fill="#a42a25" text-decoration="line-through">&#8212;miR-145-5p, miR-155-5p,</tspan>
      <tspan x="686" dy="21"><tspan fill="#a42a25" text-decoration="line-through">and miR-23b-3p&#8212;</tspan>were overexpressed,</tspan>
      <tspan x="686" dy="21"><tspan fill="#a42a25" text-decoration="line-through">suggesting a tumor-suppressive role.</tspan></tspan>
    </text>
    <text x="686" y="212" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#8a857c">AFTER, RULES 1.1 + 1.2</text>
    <text x="686" y="238" font-size="15.5" fill="#1c1917">Three miRNAs (miR-145-5p, miR-155-5p, and miR-23b-3p)</text>
    <text x="686" y="259" font-size="15.5" fill="#1c1917">were overexpressed. This fits a tumor-suppressive role.</text>
  </g>
</svg>
